server:
  port: 8081
spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://localhost:5432/linkedout?createDatabaseIfNotExist=true
    username: linkedout_user
    password: linkedout_password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret:
  expiration:
  refresh-expiration:

aws:
  access-key:
  secret-key:
  region:
  s3:
    bucket-name:

management:
  endpoints:
    web:
      exposure:
        include: health,info
